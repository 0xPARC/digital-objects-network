[package]
name = "jolt-spike"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["guest"]

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[dependencies]
jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "6d800d22dfe66968f520e95eed3dfdf52e87d562", features = ["host", "zk"] }
jolt-inlines-blake3 = { git = "https://github.com/a16z/jolt", rev = "6d800d22dfe66968f520e95eed3dfdf52e87d562", features = ["host"] }
jolt-inlines-sha2 = { git = "https://github.com/a16z/jolt", rev = "6d800d22dfe66968f520e95eed3dfdf52e87d562", features = ["host"] }
guest = { path = "./guest" }
dobj-kernel = { path = "../kernel" }
dobj-interp-rv32 = { path = "../interp-rv32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
jolt-optimizations = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }
