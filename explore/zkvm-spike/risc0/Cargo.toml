[package]
name = "risc0-spike"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["methods"]

[dependencies]
risc0-spike-methods = { path = "methods" }
risc0-zkvm = { version = "=3.1.0", features = ["prove"] }
dobj-kernel = { path = "../kernel" }
dobj-interp-rv32 = { path = "../interp-rv32" }
bincode = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = 1
lto = "thin"
